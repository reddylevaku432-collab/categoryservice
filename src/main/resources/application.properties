# ====================================
# Application Basic Configuration
# ====================================

spring.application.name=category_management_service

server.port=8083

# ====================================
# MySQL Database Configuration
# ====================================

spring.datasource.url=jdbc:mysql://localhost:3306/category_management_db
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================================
# JPA Hibernate Configuration
# ====================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =====================================
# Connection pool (Hikari CP)
# =====================================

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# =======================================
# Actuator Configuration
# =======================================

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ======================================
# Enable liveness and Readiness (for Kubernetic/realtime)
# =======================================

management.health.livenessstate.enabled=true
management.health.readneddstate.enabled=true

# =======================================
# Actuator info endpoints
# =======================================

management.info.env.enabled=true
info.app.name=category_management-service
info.app.description=springboot realtime project
info.app.version=1.0.0

# =======================================
# Jackson Date and Time
# =======================================

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

# =======================================
# Error Handling
# =======================================

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always

#=========================================
# File Uploading
# Enable multipart file uploads
#=========================================

spring.servlet.multipart.enabled=true

#=====================================================
# Size Threshold after which files are returned to disc
#=====================================================

spring.servlet.multipart.file-size-threshold=2KB

#=========================================
# Maximum size of a single uploaded file
#=========================================
spring.servlet.multipart.max-file-size=2GB

#=========================================
# Maximum size of the entire multipart request
#=========================================
spring.servlet.multipart.max-request-size=2GB
file.upload-dir=./uploads